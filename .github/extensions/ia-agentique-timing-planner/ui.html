<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Minutage · IA agentique</title>
    <link rel="stylesheet" href="/ui.css" />
  </head>
  <body>
    <a class="skip" href="#days">Aller au planning</a>
    <header class="top">
      <div>
        <h1>Minutage de la formation</h1>
        <p class="sub" id="deck-title">Chargement…</p>
      </div>
      <div class="top-actions">
        <button type="button" id="reset-overrides" class="btn">Réinitialiser les durées</button>
        <button type="button" id="reset-all" class="btn btn-ghost">Tout réinitialiser</button>
      </div>
    </header>
    <p id="status" class="status" role="status" aria-live="polite"></p>
    <div id="error" class="error" role="alert" hidden></div>
    <section id="warnings" class="warnings" hidden aria-labelledby="warnings-title">
      <h2 id="warnings-title">Avertissements</h2>
      <ul></ul>
    </section>
    <main id="days" tabindex="-1"></main>
    <footer class="foot">
      Durées lues dans les notes (« ⏱ N min ») de <code>slides/ia-agentique-feuille-de-route/index.tsx</code>.
      Les ajustements sont enregistrés hors du dépôt et ne modifient pas le deck.
    </footer>
    <script type="module" src="/ui.js"></script>
  </body>
</html>
